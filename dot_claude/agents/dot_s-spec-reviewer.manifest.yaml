notes: >-
  Built 2026-07-31 to close the S4 spec-axis gap found by the 2026-07-31
  $update-distill catalog pass: the panel reviewed code quality only, so nothing
  verified that an unattended auto-merge implemented the approved spec.
  /s*-specific, from no Source:
  (1) The CLAIMED SET review surface — the requirements THIS todo says it delivers,
  not the whole spec. Load-bearing: a plan may deliver one spec across several runs,
  and a spec-scoped reviewer would raise CRITICAL on every unscheduled requirement
  and deadlock the pipeline permanently.
  (2) The severity table mapping spec failures onto the existing contract — missing
  claimed criterion = CRITICAL, partial/non-goal-built = HIGH, scope creep = MEDIUM
  (non-blocking: deleting working code is riskier than shipping it), spec drift = LOW.
  (3) The Fixer eligibility marker and s-auto's all-not-eligible short-circuit —
  s-code-fixer verifies syntax and does not run the TDD loop, so routing an
  unimplemented requirement to it would produce untested production code and break
  S2's Iron Law.
  (4) The explicit not-a-finding list, keeping this axis clear of code quality (the
  other four members) and of plan quality (s-plan-reviewer at S4.5).
  Deliberately adds NO halt reason: blocking findings ride the existing
  CRITICAL/HIGH -> BLOCK -> fix loop -> `review stuck` path. s-auto forbids a sixth
  halt reason twice (recall, S4.5); this respects that.
